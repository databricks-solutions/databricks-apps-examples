# Configuration for the Range Optimizer MCP Server application
# Elevated permissions - full database access and LLM access for AI tools

command: ["bash", "entrypoint.sh"]

env:
  # Schema name for database tables
  # Note: Databricks automatically injects PGHOST, PGDATABASE, PGUSER for database resources
  - name: LAKEBASE_SCHEMA
    value: range_optimizer
  - name: LAKEBASE_INSTANCE_NAME
    value: daveok
  # MLflow experiment ID for tracing (injected from resource)
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: mlflow-experiment

resources:
  # Database connection with elevated privileges for MCP tools
  # Databricks automatically injects these environment variables:
  #   PGHOST - hostname of the database instance
  #   PGDATABASE - database name (databricks_postgres)
  #   PGUSER - service principal username
  #   PGAPPNAME - app name
  - name: postgres-database
    database:
      database_name: databricks_postgres
      instance_name: daveok
      permission: CAN_CONNECT_AND_CREATE  # Full access for MCP tools
  
  # SQL Warehouse for Unity Catalog queries
  - name: sql-warehouse
    sql_warehouse:
      id: 367edb93c65b15e8
      permission: CAN_USE
  
  # LLM endpoint for generating insights (MCP only)
  - name: llm-endpoint
    serving_endpoint:
      name: databricks-claude-haiku-4-5 
      permission: CAN_QUERY
  
  # MLflow experiment for GenAI tracing
  - name: mlflow-experiment
    mlflow_experiment:
      path: /Users/david.okeeffe@databricks.com/range-optimizer-mcp-traces
      permission: CAN_EDIT