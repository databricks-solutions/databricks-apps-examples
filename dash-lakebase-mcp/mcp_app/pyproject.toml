[project]
name = "range-optimizer-mcp"
version = "0.1.0"
description = "MCP Server for Stock Range Optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "databricks-sdk>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "pandas>=2.2.0",
    "fastmcp>=0.1.0",
    "mcp[cli]>=1.0.0",
    "pydantic-settings>=2.4.0",
    "mlflow>=2.14.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["range_optimizer"]
