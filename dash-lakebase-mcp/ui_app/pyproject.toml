[project]
name = "excel-writeback-ui"
version = "0.1.0"
description = "Dash UI for Excel Writeback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "databricks-sdk>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "pandas>=2.2.0",
    "dash[diskcache]>=2.17.0",
    "dash-mantine-components>=0.14.0",
    "dash-ag-grid>=31.2.0",
    "dash-iconify>=0.1.2",
    "dash-bootstrap-components>=1.6.0",
    "diskcache>=5.6.3",
    "multiprocess>=0.70.16",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_writeback"]
