# Configuration for the Range Optimizer Dash UI application
# UI app connects to MCP Server for all data operations (no direct database access)
# Architecture: ui_app --> MCP Server --> Database

command: ["bash", "entrypoint.sh"]

env:
  # MCP Server URL for all data operations (app-to-app communication)
  - name: MCP_SERVER_URL
    value: "https://range-opt-mcp-daveok-7405614596482958.18.azure.databricksapps.com"

# Note: No database resource needed - UI calls MCP server for all data operations
# The MCP server has the elevated database permissions
