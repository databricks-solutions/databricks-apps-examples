bundle:
  name: range-optimizer

variables:
  mcp_server_url:
    description: "URL for the MCP server (used by UI app for app-to-app communication)"
    default: "https://range-opt-mcp-daveok-7405614596482958.18.azure.databricksapps.com"

targets:
  dev:
    mode: development
    default: true
    variables:
      mcp_server_url: "https://range-opt-mcp-daveok-7405614596482958.18.azure.databricksapps.com"

sync:
  include:
    - notebooks/*.py

resources:
  apps:
    range_optimizer_ui:
      name: range-opt-ui-daveok
      description: Stock Range Optimization UI with Dash
      source_code_path: ui_app
      
    range_optimizer_mcp:
      name: range-opt-mcp-daveok
      description: MCP server for Range Optimizer with elevated privileges
      source_code_path: mcp_app
