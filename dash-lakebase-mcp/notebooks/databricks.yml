bundle:
  name: stock-optimization-ml

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name
    default: smarter_forecasting
  
  schema:
    description: Schema name for features and models
    default: stock_optimization
  
  catalog_storage_location:
    description: ADLS Gen2 storage location for the managed catalog (required when metastore has no root storage credential)
    default: "abfss://iceberg@stdavidokeeffeinterop02.dfs.core.windows.net/root/catalogs/smarter_forecasting"
  
  sql_warehouse_id:
    description: SQL Warehouse ID for Lakebase queries (required - Lakebase only works with serverless SQL)
    default: ""

resources:
  jobs:
    # Job 0a: Replicate Lakebase to Delta (MUST use SQL Warehouse)
    # Lakebase can ONLY be queried via serverless SQL (DBSQL), not compute
    replicate_lakebase:
      name: "[${bundle.environment}] 00a - Replicate Lakebase to Delta"
      
      tasks:
        - task_key: ctas_lakebase
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ./sql/00a_replicate_lakebase_to_delta.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              catalog_storage_location: ${var.catalog_storage_location}
      
      # No parameters needed - SQL uses query parameters directly

    # Job 0b: Create Feature Tables (reads from Delta staging, not Lakebase)
    create_feature_tables:
      name: "[${bundle.environment}] 00b - Create Feature Tables"
      
      tasks:
        - task_key: create_features
          job_cluster_key: feature_cluster
          notebook_task:
            notebook_path: ./00_create_feature_tables.py
            source: WORKSPACE
          libraries:
            - pypi:
                package: databricks-feature-engineering
      
      job_clusters:
        - job_cluster_key: feature_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_DS3_v2
            num_workers: 0
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
      
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: catalog_storage_location
          default: ${var.catalog_storage_location}

    # Job 1: Train Model
    train_stock_optimizer:
      name: "[${bundle.environment}] 01 - Train Stock Optimizer"
      
      tasks:
        - task_key: train_model
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ./01_train_stock_optimizer.py
            source: WORKSPACE
          libraries:
            - pypi:
                package: databricks-feature-engineering
            - pypi:
                package: mlflow[databricks]
      
      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: 17.3.x-cpu-ml-scala2.13
            node_type_id: Standard_DS3_v2
            num_workers: 0
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
      
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: catalog_storage_location
          default: ${var.catalog_storage_location}

    # Job 2: Deploy Serving Endpoint
    deploy_serving_endpoint:
      name: "[${bundle.environment}] 02 - Deploy Serving Endpoint"
      
      tasks:
        - task_key: deploy_endpoint
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ./02_deploy_serving_endpoint.py
            source: WORKSPACE
          libraries:
            - pypi:
                package: databricks-sdk
      
      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: 17.3.x-cpu-ml-scala2.13
            node_type_id: Standard_DS3_v2
            num_workers: 0
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
      
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: catalog_storage_location
          default: ${var.catalog_storage_location}

    # Full Pipeline Job - Run all steps in sequence
    # 1. Replicate Lakebase → Delta (SQL Warehouse)
    # 2. Create Feature Tables (classic compute)
    # 3. Train Model (ML compute)
    # 4. Deploy Endpoint (ML compute)
    full_ml_pipeline:
      name: "[${bundle.environment}] Full ML Pipeline"
      
      tasks:
        # Step 1: CTAS from Lakebase (requires SQL Warehouse)
        - task_key: replicate_lakebase
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ./sql/00a_replicate_lakebase_to_delta.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              catalog_storage_location: ${var.catalog_storage_location}
        
        # Step 2: Create feature tables from Delta staging
        - task_key: create_features
          depends_on:
            - task_key: replicate_lakebase
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ./00_create_feature_tables.py
            source: WORKSPACE
          libraries:
            - pypi:
                package: databricks-feature-engineering
        
        # Step 3: Train model
        - task_key: train_model
          depends_on:
            - task_key: create_features
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ./01_train_stock_optimizer.py
            source: WORKSPACE
          libraries:
            - pypi:
                package: databricks-feature-engineering
            - pypi:
                package: mlflow[databricks]
        
        # Step 4: Deploy serving endpoint
        - task_key: deploy_endpoint
          depends_on:
            - task_key: train_model
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ./02_deploy_serving_endpoint.py
            source: WORKSPACE
          libraries:
            - pypi:
                package: databricks-sdk
      
      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: 17.3.x-cpu-ml-scala2.13
            node_type_id: Standard_DS3_v2
            num_workers: 0
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
      
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: catalog_storage_location
          default: ${var.catalog_storage_location}

# Sync files to workspace
sync:
  include:
    - "*.py"
    - "sql/*.sql"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405614596482958.18.azuredatabricks.net

  prod:
    mode: production
    workspace:
      root_path: /Workspace/.bundle/stock_optimization_ml_prod/${bundle.name}
    
    variables:
      catalog: prod
      schema: stock_optimization
