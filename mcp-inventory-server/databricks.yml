bundle:
  name: inventory_mcp_server

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

variables:
  database:
    description: Database to be used
    default: databricks_postgres
  instance_name:
    description: Lakebase instance name
    default: daveok

targets:
  azure-east:
    mode: production 
    default: true
    workspace:
      host: https://adb-7405614596482958.18.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  apps:
    inventory_mcp_server:
      name: inventory-mcp-server
      description: MCP Server for Coles Inventory Intelligence - Query forecasts and optimization results
      source_code_path: ./
      resources:
        - sql_warehouse:
            id: 367edb93c65b15e8
            permission: CAN_USE
          name: sql-warehouse
        - database:
            database_name: ${var.database}
            instance_name: ${var.instance_name}
            permission: CAN_CONNECT_AND_CREATE
          name: postgres-database

