command: ["uv", "run", "inventory-mcp-server"]

env:
  - name: LAKEBASE_INSTANCE_NAME
    value: daveok
  - name: LAKEBASE_DATABASE
    value: databricks_postgres
  - name: LAKEBASE_SCHEMA
    value: excel_app

resources:
  # Database connection for inventory data
  - name: postgres-database
    database:
      database_name: databricks_postgres
      instance_name: daveok
      permission: CAN_CONNECT_AND_CREATE
  
  # SQL Warehouse for Unity Catalog queries
  - name: sql-warehouse
    sql_warehouse:
      id: 367edb93c65b15e8
      permission: CAN_USE
  
  # LLM endpoint for generating insights
  # See: https://apps-cookbook.dev/docs/dash/aiml/ml_serving_invoke
  - name: llm-endpoint
    serving_endpoint:
      name: databricks-meta-llama-3-3-70b-instruct
      permission: CAN_QUERY

