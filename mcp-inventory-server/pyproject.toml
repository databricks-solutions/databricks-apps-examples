# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "inventory-mcp-server"
version = "0.1.0"
description = "MCP Server for Coles Inventory Intelligence - Query forecasts and optimization results"
readme = "README.md"
requires-python = ">=3.11"

# Core dependencies required to run the MCP server
dependencies = [
    "fastapi>=0.115.12",
    "mcp[cli]>=1.14.0",
    "uvicorn>=0.34.2",
    "databricks-sdk>=0.60.0",
    "pydantic>=2",
    "fastmcp>=2.12.5",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "databricks-mcp",
    "pytest",
    "requests",
]

# ============================================================================
# Command Line Scripts
# ============================================================================

[project.scripts]
inventory-mcp-server = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

# ============================================================================
# Code Quality
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "I",      # isort - organize imports
    "B",      # bugbear - find common bugs
    "F401",   # Remove unused imports
    "E722",   # Bare except statements
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

