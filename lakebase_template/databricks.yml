bundle:
  name: "my-app"

sync:
  include:
    - .build

artifacts:
  default:
    build: uv run apx build

resources:
  database_instances:
    my-app-db:
      name: "my-app"
      capacity: "CU_1"
  apps:
    my-app-app:
      name: "my-app"
      description: "my-app created with apx"
      source_code_path: ./.build
      resources:
        - name: "db"
          database:
            database_name: "databricks_postgres"
            instance_name: ${resources.database_instances.my-app-db.name}
            permission: "CAN_CONNECT_AND_CREATE"






targets:
  dev:
    mode: development
    default: true